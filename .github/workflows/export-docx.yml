name: Export zvernennya to DOCX

on:
  push:
    branches: [main]
    paths:
      - 'zvernennya.md'
      - 'template.docx'
  workflow_dispatch:

jobs:
  export-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert zvernennya.md to DOCX
        run: |
          if [ -f template.docx ]; then
            pandoc zvernennya.md -o zvernennya.docx --reference-doc=template.docx
          else
            pandoc zvernennya.md -o zvernennya.docx
          fi

      - name: Upload DOCX artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvernennya-docx
          path: zvernennya.docx
          retention-days: 90
